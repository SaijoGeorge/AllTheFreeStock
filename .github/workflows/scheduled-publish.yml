name: Scheduled publish

# The site is static, so posts with a future pubDate stay hidden until the next build.
# Every morning this checks whether any post's pubDate fell in the last 24 hours and,
# if so, pushes an empty commit to main so Cloudflare Pages rebuilds and the post goes live.
on:
  schedule:
    - cron: "5 22 * * *" # 22:05 UTC = 9:05am AEDT (8:05am AEST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find posts due in the last 24 hours
        id: due
        run: |
          now=$(date -u +%s)
          due=""
          for f in src/content/blog/*.md src/content/blog/*.mdx; do
            [ -f "$f" ] || continue
            d=$(grep -m1 '^pubDate:' "$f" | sed -E 's/^pubDate:[[:space:]]*"?([^"]*)"?.*/\1/')
            [ -n "$d" ] || continue
            t=$(date -u -d "$d" +%s 2>/dev/null) || continue
            if [ "$t" -le "$now" ] && [ "$t" -gt $((now - 90000)) ]; then
              due="$due $(basename "$f" | sed -E 's/\.mdx?$//')"
            fi
          done
          echo "slugs=${due# }" >> "$GITHUB_OUTPUT"
          echo "Due: ${due:-none}"
      - name: Trigger a rebuild
        if: steps.due.outputs.slugs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Publish scheduled post: ${{ steps.due.outputs.slugs }}"
          git push origin HEAD:main
